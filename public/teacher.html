<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老師後台 - 骰子跑跑 Roll&Run</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <button id="mute-btn" style="position: fixed; top: 170px; right: 10px; z-index: 9999; padding: 0; font-size: 1.5rem; background: #fff; color: #333; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border:2px solid #333;">🔊</button>

    <div id="modal-overlay" class="hidden">
        <div class="modal-content">
            <h2 id="modal-title">標題</h2>
            <div id="modal-body">內容</div>
            <div id="modal-actions" style="margin-top:20px;">
                <button id="modal-btn-confirm" class="board-btn btn-green" style="font-size:1rem; padding:10px 20px;">確定執行</button>
                <button id="modal-btn-cancel" class="board-btn btn-grey hidden" style="font-size:1rem; padding:10px 20px;">取消</button>
            </div>
        </div>
    </div>

    <div id="fate-overlay">
        <div class="fate-card" id="fate-card-body">
            <div class="fate-icon" id="fate-icon">❓</div>
            <div class="fate-title" id="fate-title">機會</div>
            <div class="fate-desc" id="fate-desc">前進 2 格</div>
        </div>
    </div>

    <div id="dice-3d-container">
        <div id="dice-result-text">6 點!</div>
    </div>

    <div id="scoreboard-header">
        <div class="board-content">
            <div class="board-order">
                <h3>📜 擲骰順序</h3>
                <div id="order-list">等待抽籤...</div>
            </div>

            <div class="board-status">
                <div id="connection-status" style="font-size:0.9rem; color:#aaa;">🟢 連線正常</div>
                <div id="live-msg" style="font-size:1.4rem; color:#fff;">等待開始...</div>
                <div style="font-size:0.8rem; color:#ccc; margin-top:5px;">線上人數: <span id="player-count">0</span>/8</div>
            </div>

            <div class="game-options" style="display:flex; flex-direction:column; align-items:flex-start; gap:10px;">
                <label class="toggle-label" style="display:flex; align-items:center;">
                    <span style="display:inline-block; width:90px;">🕳️ 陷阱</span> 
                    <input type="checkbox" id="chk-trap" checked style="margin-left: 5px;">
                </label>
                
                <label class="toggle-label" style="display:flex; align-items:center;">
                    <span style="display:inline-block; width:90px;">❓ 命運</span> 
                    <input type="checkbox" id="chk-fate" checked style="margin-left: 5px; margin-right: 5px;">
                    <select id="sel-fate-count" style="padding:2px; font-size:1rem; border-radius:4px; cursor:pointer;">
                        <option value="1">1個</option>
                        <option value="2">2個</option>
                        <option value="3">3個</option>
                    </select>
                </label>
            </div>

            <div class="board-controls">
                <button id="start-btn" class="board-btn btn-grey" disabled>等待玩家...</button>
                <button id="restart-btn" class="board-btn btn-orange" disabled>下一局</button>
                <button id="reset-btn" class="board-btn btn-red">⚠️ 重置</button>
            </div>
        </div>
    </div>

    <div id="stadium-wrapper">
        <div id="audience-top" class="audience-section"></div>
        <div id="game-scroll-area">
            <div id="track-container"></div>
        </div>
        <div id="audience-bottom" class="audience-section"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="teacher.js"></script>
</body>
</html>
